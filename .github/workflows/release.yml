name: Release

# Builds the plugin when a version tag is pushed (e.g. v0.1.0) and publishes
# the installable ZIP as a downloadable GitHub Release asset.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # PhpStorm 2026.2 runs on JBR 25, so the plugin targets Java 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # No -PlocalIde here: Gradle downloads PhpStorm (platformVersion in gradle.properties).
      - name: Test
        run: ./gradlew test -PpluginVersion="$VERSION" --console=plain

      - name: Build plugin ZIP
        run: ./gradlew buildPlugin -PpluginVersion="$VERSION" --console=plain

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/distributions/php-dollar-highlight-${VERSION}.zip" \
            --title "PHP Dollar Highlight ${VERSION}" \
            --generate-notes
